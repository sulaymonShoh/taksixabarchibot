<!DOCTYPE html>
<html lang="uz" class="h-full bg-slate-900 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Taksi Xabarchi Admin{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
    </style>
</head>
<body class="h-full flex flex-col md:flex-row font-sans antialiased">
    <!-- Sidebar / Mobile Header -->
    <aside class="w-full md:w-64 bg-slate-950 border-r border-slate-800 flex flex-col flex-shrink-0">
        <div class="p-5 border-b border-slate-800 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center font-bold text-xl border border-amber-500/30">
                    🚕
                </div>
                <div>
                    <h1 class="font-bold text-base tracking-wide text-white">Taksi Xabarchi</h1>
                    <span class="text-xs text-amber-400 font-semibold px-2 py-0.5 rounded bg-amber-500/10 border border-amber-500/20">v2.0 SaaS</span>
                </div>
            </div>
        </div>
        
        <!-- Navigation Links -->
        <nav class="p-4 space-y-1.5 flex-1 custom-scrollbar overflow-y-auto">
            <a href="/" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition {% if active_page == 'dashboard' %}bg-amber-500/15 text-amber-400 border border-amber-500/30{% else %}text-slate-400 hover:bg-slate-800/60 hover:text-white{% endif %}">
                <i class="fa-solid fa-chart-pie w-5 text-center"></i>
                <span>Boshqaruv Paneli</span>
            </a>
            <a href="/users" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition {% if active_page == 'users' %}bg-amber-500/15 text-amber-400 border border-amber-500/30{% else %}text-slate-400 hover:bg-slate-800/60 hover:text-white{% endif %}">
                <i class="fa-solid fa-users w-5 text-center"></i>
                <span>Foydalanuvchilar</span>
            </a>
            <a href="/payments" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition {% if active_page == 'payments' %}bg-amber-500/15 text-amber-400 border border-amber-500/30{% else %}text-slate-400 hover:bg-slate-800/60 hover:text-white{% endif %}">
                <i class="fa-solid fa-receipt w-5 text-center"></i>
                <span>To'lov Cheklari</span>
                {% if pending_count and pending_count > 0 %}
                <span class="ml-auto bg-amber-500 text-slate-950 text-xs font-bold px-2 py-0.5 rounded-full">{{ pending_count }}</span>
                {% endif %}
            </a>
            <a href="/broadcast" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition {% if active_page == 'broadcast' %}bg-amber-500/15 text-amber-400 border border-amber-500/30{% else %}text-slate-400 hover:bg-slate-800/60 hover:text-white{% endif %}">
                <i class="fa-solid fa-bullhorn w-5 text-center"></i>
                <span>Ommaviy Xabar</span>
            </a>
            <a href="/miniapp" target="_blank" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition text-slate-400 hover:bg-slate-800/60 hover:text-white">
                <i class="fa-solid fa-mobile-screen w-5 text-center"></i>
                <span>Telegram Mini App</span>
                <i class="fa-solid fa-arrow-up-right-from-square ml-auto text-xs text-slate-500"></i>
            </a>
        </nav>
        
        <div class="p-4 border-t border-slate-800 text-xs text-slate-500 flex items-center justify-between">
            <span>Admin tizimi</span>
            <span class="flex items-center text-emerald-400 font-medium"><span class="w-2 h-2 rounded-full bg-emerald-500 mr-1.5 animate-pulse"></span> Jonli</span>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col min-w-0 bg-slate-900 overflow-y-auto custom-scrollbar">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
